<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckoutChamp Funnel Database</title>
  <link rel="stylesheet" href="database.css">
</head>
<body>
  <div class="database-container">
    <header class="db-header">
      <div class="header-top">
        <h1>Funnel Database</h1>
        <div class="header-actions">
          <button id="refreshData" class="btn btn-secondary">Refresh</button>
          <button id="exportAll" class="btn btn-success">Export All</button>
        </div>
      </div>

      <div class="search-filter-bar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search funnels and pages...">
        </div>

        <div class="filter-controls">
          <select id="storeFilter" class="filter-select">
            <option value="all">All Stores</option>
            <!-- Store options will be populated dynamically -->
          </select>

          <select id="pageTypeFilter" class="filter-select">
            <option value="all">All Page Types</option>
            <option value="1">Landing Page</option>
            <option value="2">Lead Page</option>
            <option value="3">Upsell</option>
            <option value="4">Checkout</option>
            <option value="5">Thank You</option>
            <option value="14">Static Page</option>
          </select>

          <select id="sortOrder" class="filter-select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="name-asc">Name A-Z</option>
            <option value="name-desc">Name Z-A</option>
            <option value="pages-desc">Most Pages</option>
            <option value="pages-asc">Least Pages</option>
          </select>

          <label class="checkbox-filter">
            <input type="checkbox" id="showFavoritesOnly">
            <span>Favorites Only</span>
          </label>

          <label class="checkbox-filter">
            <input type="checkbox" id="showABTestsOnly">
            <span>A/B Tests Only</span>
          </label>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat">
          <span class="stat-label">Total Funnels:</span>
          <span class="stat-value" id="totalFunnels">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Total Pages:</span>
          <span class="stat-value" id="totalPages">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Favorites:</span>
          <span class="stat-value" id="totalFavorites">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">A/B Tests:</span>
          <span class="stat-value" id="totalABTests">0</span>
        </div>
      </div>
    </header>

    <main id="databaseContent" class="database-content">
      <!-- Funnel cards will be inserted here -->
    </main>

    <div id="noData" class="no-data hidden">
      <p>No funnel data found.</p>
      <p>Visit some CheckoutChamp funnels to start tracking!</p>
    </div>

    <div id="noResults" class="no-results hidden">
      <p>No results found for your search/filters.</p>
      <button class="btn btn-secondary" id="clearFilters">Clear Filters</button>
    </div>
  </div>

  <!-- A/B Test Comparison Modal -->
  <div id="abTestModal" class="modal hidden">
    <div class="modal-content ab-test-modal">
      <div class="modal-header">
        <h2>A/B Test Comparison</h2>
        <button class="close-modal" id="closeABTestModal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="abTestContent" class="ab-test-content">
          <!-- A/B test comparison will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Page Details Modal -->
  <div id="pageDetailsModal" class="modal hidden">
    <div class="modal-content page-details-modal">
      <div class="modal-header">
        <h2>Page Details</h2>
        <button class="close-modal" id="closePageDetailsModal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="pageDetailsContent" class="page-details-content">
          <!-- Page details will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <script src="database.js"></script>
</body>
</html>
