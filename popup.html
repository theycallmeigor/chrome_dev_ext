<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funnel Navigator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1 class="logo">Funnel Navigator</h1>
        <button id="openSettings" class="settings-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v6m0 6v6m0-18a2 2 0 0 1 2 2v.5M12 1a2 2 0 0 0-2 2v.5m12 8.5h-6m-6 0H1m18 0a2 2 0 0 1-2 2h-.5M23 12a2 2 0 0 0-2-2h-.5m-8.5 12v-6m-6 0v6m6 0a2 2 0 0 1-2-2v-.5m6 0a2 2 0 0 0 2-2v-.5"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Loading State -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading funnel data...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="error hidden">
      <div class="error-icon">⚠️</div>
      <p>No funnel data found</p>
      <p class="error-hint">Make sure you're on a CheckoutChamp page</p>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-content hidden">

      <!-- Funnel Info -->
      <div class="funnel-info">
        <h2 id="funnelName" class="funnel-name">Funnel Name</h2>
      </div>

      <!-- Campaign Details Section -->
      <div class="info-section">
        <h3 class="section-title">Campaign Details</h3>
        <div id="campaignDetails" class="info-content">
          <!-- Campaign details will be inserted here -->
        </div>
      </div>

      <!-- Product Information Section -->
      <div class="info-section">
        <h3 class="section-title">Product Information</h3>
        <div id="productInfo" class="info-content">
          <!-- Product info will be inserted here -->
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <h3 class="section-title">Quick Actions</h3>
        <div class="actions-grid">

          <!-- View Funnel -->
          <div class="action-card">
            <button id="viewFunnelBtn" class="action-btn primary">
              <svg class="action-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>View Funnel</span>
            </button>
            <button id="copyViewFunnelBtn" class="copy-btn" title="Copy URL">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>

          <!-- Edit Page -->
          <div class="action-card">
            <button id="editPageBtn" class="action-btn secondary">
              <svg class="action-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span>Edit Page</span>
            </button>
            <button id="copyEditPageBtn" class="copy-btn" title="Copy URL">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>

          <!-- Preview Page -->
          <div class="action-card">
            <button id="previewPageBtn" class="action-btn accent">
              <svg class="action-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
              <span>Preview</span>
            </button>
            <button id="copyPreviewPageBtn" class="copy-btn" title="Copy URL">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>

          <!-- Live Page -->
          <div class="action-card">
            <button id="livePageBtn" class="action-btn success">
              <svg class="action-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>Live Page</span>
            </button>
            <button id="copyLivePageBtn" class="copy-btn" title="Copy URL">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>

        </div>
      </div>

      <!-- Page List (Collapsible) -->
      <div class="page-list-section">
        <button id="togglePageList" class="toggle-btn">
          <span>Pages in this Funnel</span>
          <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div id="pagesList" class="pages-list collapsed">
          <!-- Pages will be dynamically inserted here -->
        </div>
      </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">
      <span id="toastMessage"></span>
    </div>

    <!-- A/B Test Modal -->
    <div id="abTestModal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3>A/B Test Details</h3>
          <button id="closeModal" class="close-btn">×</button>
        </div>
        <div id="abTestContent" class="modal-body">
          <!-- A/B test details will be inserted here -->
        </div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
