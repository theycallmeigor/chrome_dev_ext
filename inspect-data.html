<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Inspector for Funnel Navigator</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      padding: 20px;
      background: #1e293b;
      color: #e2e8f0;
    }
    h1 {
      color: #60a5fa;
    }
    .section {
      background: #334155;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
    }
    pre {
      background: #0f172a;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      max-height: 600px;
      overflow-y: auto;
    }
    .highlight {
      color: #fbbf24;
      font-weight: bold;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <h1>🔍 Funnel Data Inspector</h1>
  <p>This page will show you the ACTUAL structure of your CheckoutChamp funnel data.</p>

  <button onclick="inspectData()">🔍 Inspect Current Page Data</button>
  <button onclick="copyToClipboard()">📋 Copy Full Data to Clipboard</button>

  <div id="results"></div>

  <script>
    function inspectData() {
      const resultsDiv = document.getElementById('results');

      // Check if funnelData exists
      const funnelDataStr = sessionStorage.getItem('funnelData');

      if (!funnelDataStr) {
        resultsDiv.innerHTML = `
          <div class="section">
            <h2>❌ No funnelData found</h2>
            <p>You need to be on a CheckoutChamp funnel page.</p>
            <p>Current URL: ${window.location.href}</p>
          </div>
        `;
        return;
      }

      try {
        const funnelData = JSON.parse(funnelDataStr);

        let html = `
          <div class="section">
            <h2>✅ Funnel Data Found!</h2>
            <p><span class="highlight">Funnel Name:</span> ${funnelData.name || 'N/A'}</p>
            <p><span class="highlight">Funnel ID:</span> ${funnelData.referenceId || 'N/A'}</p>
            <p><span class="highlight">Campaign ID:</span> ${funnelData.campaign || 'N/A'}</p>
            <p><span class="highlight">Total Pages:</span> ${funnelData.pages?.length || 0}</p>
          </div>
        `;

        // Inspect first page structure
        if (funnelData.pages && funnelData.pages.length > 0) {
          const firstPage = funnelData.pages[0];

          html += `
            <div class="section">
              <h2>📄 First Page Structure</h2>
              <p><span class="highlight">Title:</span> ${firstPage.title || 'N/A'}</p>
              <p><span class="highlight">Reference ID:</span> ${firstPage.referenceId || 'N/A'}</p>
              <p><span class="highlight">URL Slug:</span> ${firstPage.urlSlug || 'N/A'}</p>
              <p><span class="highlight">Page Number Field:</span> ${firstPage.pageNumber !== undefined ? firstPage.pageNumber : '❌ MISSING'}</p>
              <p><span class="highlight">Split Enabled:</span> ${firstPage.splitEnabled}</p>
              <p><span class="highlight">PageView Array Length:</span> ${firstPage.pageView?.length || 0}</p>
              <p><span class="highlight">Created At:</span> ${firstPage.createdAt || 'N/A'}</p>
              <p><span class="highlight">Updated At:</span> ${firstPage.updatedAt || 'N/A'}</p>

              <h3>Available Fields on First Page:</h3>
              <pre>${Object.keys(firstPage).join('\n')}</pre>

              <h3>PageView Data:</h3>
              <pre>${JSON.stringify(firstPage.pageView, null, 2)}</pre>

              <h3>Product Data:</h3>
              <pre>${JSON.stringify(firstPage.product || firstPage.products || 'No product data', null, 2)}</pre>
            </div>
          `;

          // Check all pages for page number field
          html += `
            <div class="section">
              <h2>📊 All Pages Summary</h2>
              <table style="width: 100%; border-collapse: collapse;">
                <tr style="background: #1e293b;">
                  <th style="padding: 8px; text-align: left; border: 1px solid #475569;">Title</th>
                  <th style="padding: 8px; text-align: left; border: 1px solid #475569;">pageNumber</th>
                  <th style="padding: 8px; text-align: left; border: 1px solid #475569;">Split Enabled</th>
                  <th style="padding: 8px; text-align: left; border: 1px solid #475569;">PageViews</th>
                </tr>
          `;

          funnelData.pages.forEach(page => {
            html += `
              <tr style="border: 1px solid #475569;">
                <td style="padding: 8px; border: 1px solid #475569;">${page.title || 'Untitled'}</td>
                <td style="padding: 8px; border: 1px solid #475569;">${page.pageNumber !== undefined ? page.pageNumber : '❌ N/A'}</td>
                <td style="padding: 8px; border: 1px solid #475569;">${page.splitEnabled ? '✅ YES' : '❌ NO'}</td>
                <td style="padding: 8px; border: 1px solid #475569;">${page.pageView?.length || 0}</td>
              </tr>
            `;
          });

          html += `</table></div>`;
        }

        // Show full data structure
        html += `
          <div class="section">
            <h2>📦 Full Data Structure</h2>
            <pre id="fullData">${JSON.stringify(funnelData, null, 2)}</pre>
          </div>
        `;

        resultsDiv.innerHTML = html;

      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="section">
            <h2>❌ Error Parsing Data</h2>
            <p>${error.message}</p>
            <pre>${funnelDataStr}</pre>
          </div>
        `;
      }
    }

    function copyToClipboard() {
      const funnelDataStr = sessionStorage.getItem('funnelData');
      if (!funnelDataStr) {
        alert('No funnel data found!');
        return;
      }

      navigator.clipboard.writeText(funnelDataStr).then(() => {
        alert('✅ Funnel data copied to clipboard!');
      }).catch(err => {
        alert('❌ Failed to copy: ' + err);
      });
    }

    // Auto-inspect on load
    window.addEventListener('load', () => {
      setTimeout(inspectData, 500);
    });
  </script>
</body>
</html>
